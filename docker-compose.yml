# Production-like stack: Postgres(+pgvector) · API · background worker · (web is served by the API from frontend/dist)
# Dev: `docker compose up -d db` and run the API/worker locally (see README).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careers}
      POSTGRES_DB: careers
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U careers"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8787 --proxy-headers"
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+psycopg://careers:${POSTGRES_PASSWORD:-careers}@db:5432/careers" }
    ports: ["8787:8787"]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["careers-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.workers.run
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+psycopg://careers:${POSTGRES_PASSWORD:-careers}@db:5432/careers" }
    depends_on: { db: { condition: service_healthy } }
    volumes: ["careers-data:/data"]
    restart: unless-stopped
volumes:
  pgdata:
  careers-data:
