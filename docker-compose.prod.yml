# Production stack for a single VM (Oracle Always Free, Hetzner, ...):  Caddy (HTTPS) -> API -> Postgres, plus the worker.
# Only Caddy is exposed (80/443). Run:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: careers
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U careers"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8787 --proxy-headers --forwarded-allow-ips='*'"
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://careers:${POSTGRES_PASSWORD}@db:5432/careers"
      CAREERS_ENV: prod
      CAREERS_COOKIE_SECURE: "1"
      CAREERS_TRUST_PROXY: "1"
    expose: ["8787"]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["careers-data:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.workers.run
    env_file: [.env]
    environment:
      DATABASE_URL: "postgresql+psycopg://careers:${POSTGRES_PASSWORD}@db:5432/careers"
      CAREERS_ENV: prod
    depends_on: { db: { condition: service_healthy } }
    volumes: ["careers-data:/data"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  pgdata:
  careers-data:
  caddy-data:
  caddy-config:
